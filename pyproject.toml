[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-disease"
version = "0.1.0"
description = "Reproducible disease-mechanism research. First program: endometriosis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
open-disease = "open_disease.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
