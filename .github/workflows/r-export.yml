name: Sparse raw-count export tests (synthetic)
on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-sparse-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - name: Verify Matrix availability
        run: Rscript -e 'stopifnot(requireNamespace("Matrix", quietly=TRUE))'
      - name: Run existing synthetic-only sparse exporter tests
        run: Rscript scripts/test_seurat_to_pseudobulk.R
      - name: Test sample-mapping exporter and excluded-stratum audit
        run: Rscript tests/r/test_export_pseudobulk.R
      - name: Verify two mapping interfaces produce identical donor-level raw counts
        run: Rscript tests/r/test_cross_exporters.R
      - name: Check Swiss sparse pathway scoring against a synthetic dense reference
        run: Rscript tests/r/test_swiss_glandular.R
