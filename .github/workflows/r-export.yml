name: Sparse raw-count export tests (synthetic)
on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-sparse-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - name: Verify Matrix availability
        run: Rscript -e 'stopifnot(requireNamespace("Matrix", quietly=TRUE))'
      - name: Run synthetic-only sparse aggregation tests
        run: Rscript scripts/test_seurat_to_pseudobulk.R
