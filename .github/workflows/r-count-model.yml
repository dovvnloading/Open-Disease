name: edgeR donor count model (synthetic)
on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edgeR:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install Python synthetic-only research tools
        run: python -m pip install -e ".[dev]"
      - name: Install stable Bioconductor edgeR
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")'
          Rscript -e 'BiocManager::install("edgeR", ask=FALSE, update=FALSE)'
          Rscript -e 'stopifnot(packageVersion("edgeR") >= "4.0.0")'
      - name: Generate artificial study with fake genes
        run: bash scripts/run_demo.sh
      - name: Exercise exploratory quasi-likelihood and failure tests
        run: Rscript scripts/test_edger_pseudobulk_ql.R
      - name: Test CLI output
        run: |
          mkdir -p results/synthetic-ql
          Rscript scripts/edger_pseudobulk_ql.R \
            --pseudobulk results/synthetic-demo/pseudobulk.csv \
            --study synthetic-discovery --phase proliferative \
            --cell-type epithelial --adjust none \
            --out results/synthetic-ql/de.csv
          test -s results/synthetic-ql/de.csv
          grep -q SYN000 results/synthetic-ql/de.csv
