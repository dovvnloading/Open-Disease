name: Research pipeline tests
on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate research code
        run: python -m pytest -q
      - name: Exercise synthetic end-to-end workflow
        run: bash scripts/run_demo.sh
      - name: Check synthetic provenance and output
        run: |
          test -f results/synthetic-demo/SYNTHETIC_ONLY.json
          test -s results/synthetic-demo/validation.csv
          grep -q "SYN000" results/synthetic-demo/validation.csv
