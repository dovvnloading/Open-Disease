name: Research pipeline tests
on:
  push:
    branches: ["main", "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify source catalog and restricted-file guard
        run: |
          python scripts/verify_catalog.py
          python scripts/repo_safety.py
      - name: Run unit and integration tests
        run: python -m pytest -q
      - name: Run synthetic end-to-end research demo
        run: |
          bash scripts/run_demo.sh
          python scripts/audit_cohort.py --pseudobulk results/synthetic-demo/pseudobulk.csv --out results/synthetic-demo/qc.csv
      - name: Verify synthetic provenance and output
        run: |
          test -f results/synthetic-demo/SYNTHETIC_ONLY.json
          test -s results/synthetic-demo/validation.csv
          test -s results/synthetic-demo/qc.csv
          grep -q "SYN000" results/synthetic-demo/validation.csv

  r-pseudobulk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Confirm Matrix is available
        run: Rscript -e 'stopifnot(requireNamespace("Matrix", quietly = TRUE))'
      - name: Verify offline count aggregation on entirely synthetic cells
        run: Rscript tests/r/test_export_pseudobulk.R
